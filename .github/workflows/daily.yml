name: Activity panel

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's shortest interval; runs can start a few minutes late
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/activity.py, scripts/src/events.txt, scripts/src/poses/**, .github/workflows/daily.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity.py out
      - name: Publish to the output branch
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update activity panel"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
