<text x="72" y="72" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.4" fill="#2997ff">ABOUT ME</text><text x="70" y="124" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2" fill="url(#name)">Hey, what's up?</text><text x="72" y="178" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21"><tspan fill="#c7c7cc">I'm </tspan><tspan fill="#f5f5f7" font-weight="700">Nathaporn </tspan><tspan fill="#f5f5f7" font-weight="700">Saituptim </tspan><tspan fill="#c7c7cc">— </tspan><tspan fill="#c7c7cc">a </tspan><tspan fill="#c7c7cc">high </tspan><tspan fill="#c7c7cc">school </tspan><tspan fill="#c7c7cc">student </tspan><tspan fill="#c7c7cc">developer </tspan><tspan fill="#c7c7cc">and </tspan><tspan fill="#c7c7cc">robotics </tspan><tspan fill="#c7c7cc">innovator </tspan><tspan fill="#c7c7cc">from </tspan><tspan fill="#c7c7cc">Thailand. </tspan><tspan fill="#c7c7cc">I </tspan><tspan fill="#c7c7cc">build </tspan></text><text x="72" y="211" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21"><tspan fill="#c7c7cc">end-to-end </tspan><tspan fill="#c7c7cc">products </tspan><tspan fill="#c7c7cc">that </tspan><tspan fill="#c7c7cc">bridge </tspan><tspan fill="#c7c7cc">smart </tspan><tspan fill="#c7c7cc">software </tspan><tspan fill="#c7c7cc">with </tspan><tspan fill="#c7c7cc">physical </tspan><tspan fill="#c7c7cc">hardware: </tspan><tspan fill="#c7c7cc">AI </tspan><tspan fill="#c7c7cc">and </tspan><tspan fill="#c7c7cc">computer </tspan><tspan fill="#c7c7cc">vision, </tspan><tspan fill="#c7c7cc">autonomous </tspan></text><text x="72" y="244" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21"><tspan fill="#c7c7cc">robots, </tspan><tspan fill="#c7c7cc">full-stack </tspan><tspan fill="#c7c7cc">web </tspan><tspan fill="#c7c7cc">apps, </tspan><tspan fill="#c7c7cc">and </tspan><tspan fill="#c7c7cc">embedded </tspan><tspan fill="#c7c7cc">IoT. </tspan></text><rect x="72" y="303" width="1056" height="134" rx="20" fill="#2997ff" fill-opacity=".08" stroke="#2997ff" stroke-opacity=".35"/><text x="100" y="347" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f5f5f7">Founder &amp; CEO of <tspan fill="url(#dp)">DeePer</tspan></text><text x="1100" y="346" text-anchor="end" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#2997ff">deeper.in.th</text><text x="100" y="381" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="19"><tspan fill="#c7c7cc">A </tspan><tspan fill="#c7c7cc">free </tspan><tspan fill="#c7c7cc">web </tspan><tspan fill="#c7c7cc">app </tspan><tspan fill="#c7c7cc">of </tspan><tspan fill="#c7c7cc">deep </tspan><tspan fill="#c7c7cc">conversation </tspan><tspan fill="#c7c7cc">cards </tspan><tspan fill="#c7c7cc">for </tspan><tspan fill="#c7c7cc">couples, </tspan><tspan fill="#c7c7cc">friends </tspan><tspan fill="#c7c7cc">&amp; </tspan><tspan fill="#c7c7cc">family. </tspan><tspan fill="#c7c7cc">1,050+ </tspan><tspan fill="#c7c7cc">curated </tspan><tspan fill="#c7c7cc">questions, </tspan><tspan fill="#c7c7cc">swipe </tspan><tspan fill="#c7c7cc">and </tspan><tspan fill="#c7c7cc">take </tspan></text><text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="19"><tspan fill="#c7c7cc">turns </tspan><tspan fill="#c7c7cc">on </tspan><tspan fill="#c7c7cc">one </tspan><tspan fill="#c7c7cc">phone. </tspan></text><circle cx="78" cy="470" r="4" fill="#2997ff"/><text x="98" y="477" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="20"><tspan fill="#c7c7cc">Working </tspan><tspan fill="#c7c7cc">at </tspan><tspan fill="#f5f5f7" font-weight="700">Yeah </tspan><tspan fill="#f5f5f7" font-weight="700">Association </tspan></text><circle cx="78" cy="511" r="4" fill="#2997ff"/><text x="98" y="518" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="20"><tspan fill="#c7c7cc">Currently </tspan><tspan fill="#c7c7cc">building </tspan><tspan fill="#c7c7cc">autonomous </tspan><tspan fill="#c7c7cc">systems, </tspan><tspan fill="#c7c7cc">full-stack </tspan><tspan fill="#c7c7cc">web </tspan><tspan fill="#c7c7cc">apps, </tspan><tspan fill="#c7c7cc">and </tspan><tspan fill="#c7c7cc">embedded </tspan><tspan fill="#c7c7cc">IoT </tspan><tspan fill="#c7c7cc">solutions </tspan></text><circle cx="78" cy="552" r="4" fill="#2997ff"/><text x="98" y="559" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="20"><tspan fill="#c7c7cc">Ask </tspan><tspan fill="#c7c7cc">me </tspan><tspan fill="#c7c7cc">about </tspan><tspan fill="#c7c7cc">AI </tspan><tspan fill="#c7c7cc">models, </tspan><tspan fill="#c7c7cc">robotics, </tspan><tspan fill="#c7c7cc">startups, </tspan><tspan fill="#c7c7cc">or </tspan><tspan fill="#c7c7cc">slick </tspan><tspan fill="#c7c7cc">UI </tspan><tspan fill="#c7c7cc">design </tspan></text><circle cx="78" cy="593" r="4" fill="#2997ff"/><text x="98" y="600" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="20"><tspan fill="#c7c7cc">Fun </tspan><tspan fill="#c7c7cc">fact: </tspan><tspan fill="#c7c7cc">I </tspan><tspan fill="#c7c7cc">love </tspan><tspan fill="#c7c7cc">Apple-style </tspan><tspan fill="#c7c7cc">minimalist </tspan><tspan fill="#c7c7cc">layouts </tspan><tspan fill="#c7c7cc">and </tspan><tspan fill="#c7c7cc">dark-themed </tspan><tspan fill="#c7c7cc">dev </tspan><tspan fill="#c7c7cc">setups </tspan></text>
