 fill="#dcdce1">vision, </tspan><tspan fill="#dcdce1">autonomous </tspan><tspan fill="#dcdce1">robots, </tspan><tspan fill="#dcdce1">full-stack </tspan><tspan fill="#dcdce1">web </tspan><tspan fill="#dcdce1">apps, </tspan><tspan fill="#dcdce1">and </tspan><tspan fill="#dcdce1">embedded </tspan><tspan fill="#dcdce1">IoT. </tspan></text><rect x="72" y="319" width="1056" height="146" rx="20" fill="#2997ff" fill-opacity=".08" stroke="#2997ff" stroke-opacity=".35"/><text x="100" y="363" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Founder &amp; CEO of <tspan fill="#4aa8ff">DeePer</tspan></text><text x="1100" y="362" text-anchor="end" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="1" fill="#2997ff">deeper.in.th</text><text x="100" y="403" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21"><tspan fill="#dcdce1">A </tspan><tspan fill="#dcdce1">free </tspan><tspan fill="#dcdce1">web </tspan><tspan fill="#dcdce1">app </tspan><tspan fill="#dcdce1">of </tspan><tspan fill="#dcdce1">deep </tspan><tspan fill="#dcdce1">conversation </tspan><tspan fill="#dcdce1">cards </tspan><tspan fill="#dcdce1">for </tspan><tspan fill="#dcdce1">couples, </tspan><tspan fill="#dcdce1">friends </tspan><tspan fill="#dcdce1">&amp; </tspan><tspan fill="#dcdce1">family. </tspan><tspan fill="#dcdce1">1,050+ </tspan><tspan fill="#dcdce1">curated </tspan><tspan fill="#dcdce1">questions, </tspan><tspan fill="#dcdce1">swipe </tspan></text><text x="100" y="435" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21"><tspan fill="#dcdce1">and </tspan><tspan fill="#dcdce1">take </tspan><tspan fill="#dcdce1">turns </tspan><tspan fi